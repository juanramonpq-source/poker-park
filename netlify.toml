[build]
  command = "npm run build"
  publish = ".vercel/output/static"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/achievement"
  to = "https://poker-park-production.up.railway.app/api/achievement"
  status = 200
  force = true

[[redirects]]
  from = "/api/rtc"
  to = "https://poker-park-production.up.railway.app/api/rtc"
  status = 200
  force = true
